}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>

const DB_NAME = "SiteInspectionDB_V3";
const PROJECT_STORE = "projects";
const RECORD_STORE = "records";

let db;
let stream = null;
let mode = "note";
let rawImage = null;
let currentProjectId = null;

const $ = id => document.getElementById(id);

/* =========================
   DATABASE
========================= */

function openDB(){

 return new Promise((resolve,reject)=>{

  const request =
   indexedDB.open(DB_NAME,1);

  request.onupgradeneeded = () => {

   const database = request.result;

   if(!database.objectStoreNames.contains(PROJECT_STORE)){
    const store =
     database.createObjectStore(
      PROJECT_STORE,
      {keyPath:"id",autoIncrement:true}
     );

    store.createIndex(
     "created",
     "created"
    );
   }

   if(!database.objectStoreNames.contains(RECORD_STORE)){

    const store =
     database.createObjectStore(
      RECORD_STORE,
      {keyPath:"id",autoIncrement:true}
     );

    store.createIndex(
     "projectId",
     "projectId"
    );

    store.createIndex(
     "date",
     "date"
    );
   }

  };

  request.onsuccess = () => {
   db = request.result;
   resolve();
  };

  request.onerror = () =>
   reject(request.error);

 });
}

function store(name,mode){

 return db
  .transaction(name,mode)
  .objectStore(name);
}

/* =========================
   PROJECT FUNCTIONS
========================= */

function addProjectDB(project){

 return new Promise((resolve,reject)=>{

  const r =
   store(PROJECT_STORE,"readwrite")
   .add(project);

  r.onsuccess = () =>
   resolve(r.result);

  r.onerror = () =>
   reject(r.error);

 });
}

function getProjects(){

 return new Promise((resolve,reject)=>{

  const r =
   store(PROJECT_STORE,"readonly")
   .getAll();

  r.onsuccess = () =>
   resolve(
    r.result.sort(
     (a,b)=>b.created-a.created
    )
   );

  r.onerror = () =>
   reject(r.error);

 });
}

function deleteProject(id){

 return new Promise((resolve,reject)=>{

  const r =
   store(PROJECT_STORE,"readwrite")
   .delete(id);

  r.onsuccess = () =>
   resolve();

  r.onerror = () =>
   reject(r.error);

 });
}

/* =========================
   RECORD FUNCTIONS
========================= */

function addRecord(record){

 return new Promise((resolve,reject)=>{

  const r =
   store(RECORD_STORE,"readwrite")
   .add(record);

  r.onsuccess = () =>
   resolve(r.result);

  r.onerror = () =>
   reject(r.error);

 });
}

function getProjectRecords(projectId){

 return new Promise((resolve,reject)=>{

  const index =
   store(RECORD_STORE,"readonly")
   .index("projectId");

  const r =
   index.getAll(projectId);

  r.onsuccess = () => {

   resolve(
    r.result.sort(
     (a,b)=>b.date-a.date
    )
   );

  };

  r.onerror = () =>
   reject(r.error);

 });
}

function deleteRecord(id){

 return new Promise((resolve,reject)=>{

  const r =
   store(RECORD_STORE,"readwrite")
   .delete(id);

  r.onsuccess = () =>
   resolve();

  r.onerror = () =>
   reject(r.error);

 });
}

function deleteProjectRecords(projectId){

 return new Promise((resolve,reject)=>{

  const database = db;

  const tx =
   database.transaction(
    RECORD_STORE,
    "readwrite"
   );

  const index =
   tx.objectStore(RECORD_STORE)
   .index("projectId");

  const req =
   index.openCursor(
    IDBKeyRange.only(projectId)
   );

  req.onsuccess = event => {

   const cursor =
    event.target.result;

   if(cursor){

    cursor.delete();
    cursor.continue();

   }

  };

  tx.oncomplete = () =>
   resolve();

  tx.onerror = () =>
   reject(tx.error);

 });
}

/* =========================
   PROJECT UI
========================= */

async function renderProjects(){

 const projects =
  await getProjects();

 const box =
  $("projectsList");

 box.innerHTML = "";

 if(!projects.length){

  box.innerHTML =
   `<div class="empty">
    لا توجد مشاريع.<br>
    أضف أول مشروع من الأعلى.
   </div>`;

  currentProjectId = null;
  renderCurrentProject(null);
  renderRecords();

  return;
 }

 if(
  !currentProjectId ||
  !projects.some(
   p=>p.id===currentProjectId
  )
 ){

  currentProjectId =
   projects[0].id;

 }

 projects.forEach(project=>{

  const div =
   document.createElement("div");

  div.className =
   "project-item " +
   (
    project.id===currentProjectId
    ?"active":""
   );

  div.innerHTML = `

   <div
    style="flex:1"
    onclick="selectProject(${project.id})"
   >

    <div class="project-name">
     🏗️ ${escapeHtml(project.name)}
    </div>

    <div class="muted">
     ${escapeHtml(project.code || "بدون كود")}
    </div>

   </div>

   <div class="project-actions">

    <button
     class="outline"
     onclick="selectProject(${project.id})"
    >
     فتح
    </button>

    <button
     class="danger"
     onclick="removeProject(${project.id})"
    >
     حذف
    </button>

   </div>
  `;

  box.appendChild(div);

 });

 renderCurrentProject(
  projects.find(
   p=>p.id===currentProjectId
  )
 );

 renderRecords();
}

function selectProject(id){

 currentProjectId = id;

 renderProjects();

}

async function renderCurrentProject(project){

 const box =
  $("currentProjectBox");

 if(!project){

  box.innerHTML =
   `<div class="empty">
    اختر مشروعًا للبدء.
   </div>`;

  return;
 }

 box.innerHTML = `

  <div class="project-title">
   🏗️ ${escapeHtml(project.name)}
  </div>

  <span class="badge">
   ${escapeHtml(project.code || "Project")}
  </span>

  <div class="top-actions">

   <button
    class="primary"
    onclick="scrollToInspection()"
   >
    ➕ Inspection جديد
   </button>

  </div>

 `;

}

async function removeProject(id){

 const projects =
  await getProjects();

 const project =
  projects.find(p=>p.id===id);

 if(!project)return;

 if(
  !confirm(
   `حذف مشروع "${project.name}" وكل سجلاته؟`
  )
 )return;

 await deleteProjectRecords(id);

 await deleteProject(id);

 if(currentProjectId===id){

  currentProjectId = null;

 }

 await renderProjects();

}

/* =========================
   ADD PROJECT
========================= */

$("addProjectBtn").onclick =
 async ()=>{

  const name =
   $("newProject")
   .value
   .trim();

  const code =
   $("newProjectCode")
   .value
   .trim();

  if(!name){

   alert("اكتب اسم المشروع أولاً.");

   return;
  }

  const id =
   await addProjectDB({
    name,
    code,
    created:Date.now()
   });

  $("newProject").value="";
  $("newProjectCode").value="";

  currentProjectId=id;

  await renderProjects();

 };

/* =========================
   CAMERA
========================= */

async function startPhoto(){

 if(!currentProjectId){

  alert("اختر المشروع أولاً.");

  return;
 }

 mode="photo";

 $("editor").style.display="block";

 $("preview").style.display="none";

 $("camera").style.display="block";

 $("photoHint").textContent =
  "التقط الصورة ثم اكتب الملاحظة. سيتم حفظ الصورة مع الملاحظة.";

 try{

  stream =
   await navigator.mediaDevices.getUserMedia({

    video:{
     facingMode:{
      ideal:"environment"
     }
    },

    audio:false

   });

  $("camera").srcObject =
   stream;

  $("note").value="";

  let old =
   $("snapBtn");

  if(old)old.remove();

  const btn =
   document.createElement("button");

  btn.className="primary";

  btn.id="snapBtn";

  btn.textContent=
   "📸 التقاط الصورة";

  btn.style.marginTop="10px";

  btn.onclick=capture;

  $("editor")
   .insertBefore(
    btn,
    $("canvas")
   );

 }catch(e){

  alert(
   "لم يتم فتح الكاميرا. اسمح للموقع باستخدام الكاميرا ثم حاول مرة أخرى."
  );

 }

}

function capture(){

 const video =
  $("camera");

 const canvas =
  $("canvas");

 if(
  !video.videoWidth ||
  !video.videoHeight
 ){

  alert("انتظر لحظة حتى تظهر صورة الكاميرا.");

  return;
 }

 canvas.width =
  video.videoWidth;

 canvas.height =
  video.videoHeight;

 const ctx =
  canvas.getContext("2d");

 ctx.drawImage(
  video,
  0,
  0,
  canvas.width,
  canvas.height
 );

 rawImage =
  canvas.toDataURL(
   "image/jpeg",
   .90
  );

 $("preview").src =
  rawImage;

 $("preview").style.display=
  "block";

 $("camera").style.display=
  "none";

 if(stream){

  stream
   .getTracks()
   .forEach(
    t=>t.stop()
   );

  stream=null;
 }

 const b =
  $("snapBtn");

 if(b)b.remove();

}

function startNote(){

 if(!currentProjectId){

  alert("اختر المشروع أولاً.");

  return;
 }

 mode="note";

 rawImage=null;

 $("editor").style.display=
  "block";

 $("preview").style.display=
  "none";

 $("camera").style.display=
  "none";

 $("note").value="";

 $("photoHint").textContent=
  "ملاحظة بدون صورة.";

}

$("photoBtn").onclick =
 startPhoto;

$("noteBtn").onclick =
 startNote;

/* =========================
   SAVE INSPECTION
========================= */

async function save(){

 if(!currentProjectId){

  alert("اختر المشروع أولاً.");

  return;
 }

 const unit =
  $("unit").value.trim();

 const engineer =
  $("engineer").value.trim();

 const note =
  $("note").value.trim();

 if(
  !unit ||
  !engineer ||
  !note
 ){

  alert(
   "اكتب رقم الوحدة والمهندس والملاحظة."
  );

  return;
 }

 if(
  mode==="photo" &&
  !rawImage
 ){

  alert("التقط الصورة أولاً.");

  return;
 }

 const projects =
  await getProjects();

 const project =
  projects.find(
   p=>p.id===currentProjectId
  );

 if(!project)return;

 let finalImage="";

 if(mode==="photo"){

  const canvas =
   $("canvas");

  const ctx =
   canvas.getContext("2d");

  const img =
   new Image();

  img.src =
   rawImage;

  await new Promise(
   resolve=>{
    img.onload=resolve
   }
  );

  canvas.width =
   img.naturalWidth;

  canvas.height =
   img.naturalHeight;

  ctx.drawImage(
   img,
   0,
   0
  );

  const boxH =
   Math.max(
    100,
    canvas.height*.20
   );

  ctx.fillStyle=
   "rgba(0,0,0,.68)";

  ctx.fillRect(
   0,
   canvas.height-boxH,
   canvas.width,
   boxH
  );

  ctx.fillStyle="white";

  ctx.font=
   `bold ${Math.max(26,canvas.width/30)}px Arial`;

  ctx.textAlign="center";

  ctx.textBaseline="middle";

  const words =
   note.split(/\s+/);

  const lines=[];

  let line="";

  const max =
   canvas.width-60;

  for(
   const word of words
  ){

   const test =
    line
    ?line+" "+word
    :word;

   if(
    ctx.measureText(test).width>max
    &&
    line
   ){

    lines.push(line);

    line=word;

   }else{

    line=test;

   }

  }

  if(line)
   lines.push(line);

  let y =
   canvas.height-
   boxH+
   boxH/2-
   (lines.length-1)*22;

  lines.forEach(
   l=>{

    ctx.fillText(
     l,
     canvas.width/2,
     y
    );

    y+=
     Math.max(
      38,
      canvas.width/32
     );

   }
  );

  finalImage =
   canvas.toDataURL(
    "image/jpeg",
    .92
   );

 }

 await addRecord({

  projectId:currentProjectId,

  project:project.name,

  projectCode:
   project.code || "",

  unit,

  engineer,

  note,

  photo:finalImage,

  kind:mode,

  date:Date.now()

 });

 $("unit").value="";

 $("note").value="";

 $("editor").style.display=
  "none";

 rawImage=null;

 await renderRecords();

 alert("تم حفظ Inspection بنجاح ✅");

}

/* =========================
   RECORDS
========================= */

async function renderRecords(){

 const box =
  $("records");

 if(!currentProjectId){

  $("count").textContent="(0)";

  box.innerHTML=
   `<div class="empty">
    اختر مشروعًا.
   </div>`;

  return;
 }

 const rs =
  await getProjectRecords(
   currentProjectId
  );

 $("count").textContent=
  `(${rs.length})`;

 box.innerHTML="";

 if(!rs.length){

  box.innerHTML=
   `<div class="empty">
    لا توجد Inspections لهذا المشروع حتى الآن.
   </div>`;

  return;
 }

 rs.forEach(
  r=>{

   const el =
    document.createElement("div");

   el.className="rec";

   const date =
    new Date(
     r.date
    ).toLocaleString(
     "ar-EG"
    );

   el.innerHTML=

    r.photo

    ?

    `<img
      class="thumb"
      src="${r.photo}"
    >`

    :

    `<div
      class="thumb"
      style="display:grid;place-items:center;font-size:30px"
    >
      📝
    </div>`

    +

    `<div style="flex:1">

      <h3>
       ${escapeHtml(r.unit)}
      </h3>

      <div class="muted">
       ${escapeHtml(r.engineer)}
       —
       ${date}
      </div>

      <p>
       ${escapeHtml(r.note)}
      </p>

      <button
       class="danger"
       style="margin-top:8px;padding:7px 10px;font-size:12px"
       onclick="removeRecord(${r.id})"
      >
       🗑️ حذف
      </button>

    </div>`;

   box.appendChild(el);

  }
 );

}

async function removeRecord(id){

 if(
  !confirm("حذف هذا الـInspection؟")
 )return;

 await deleteRecord(id);

 await renderRecords();

}

/* =========================
   CSV
========================= */

function escapeCSV(value){

 return `"${String(
  value ?? ""
 ).replace(
  /"/g,
  '""'
 )}"`;

}

async function exportCSV(){

 if(!currentProjectId){

  alert("اختر المشروع.");

  return;
 }

 const rs =
  await getProjectRecords(
   currentProjectId
  );

 if(!rs.length){

  alert("لا توجد سجلات.");

  return;
 }

 const rows=[

  [
   "Project",
   "Project Code",
   "Unit",
   "Engineer",
   "Date",
   "Type",
   "Inspection Note",
   "Photo"
  ]

 ];

 rs.forEach(
  r=>{

   rows.push([

    r.project,

    r.projectCode,

    r.unit,

    r.engineer,

    new Date(
     r.date
    ).toLocaleString(
     "en-GB"
    ),

    r.kind==="photo"
     ?"Photo Inspection"
     :"Note Only",

    r.note,

    r.photo
     ?"Embedded in Excel"
     :""

   ]);

  }
 );

 const csv =
  "\ufeff"+
  rows
   .map(
    row=>
     row
      .map(escapeCSV)
      .join(",")
   )
   .join("\r\n");

 const blob =
  new Blob(
   [csv],
   {
    type:
     "text/csv;charset=utf-8"
   }
  );

 downloadBlob(
  blob,
  "site_inspections.csv"
 );

}

   '"':"&quot;",

 );

}

async function exportExcel(){

 if(!currentProjectId){

  alert("اختر المشروع.");

  return;
 }

 const records =
  await getProjectRecords(
   currentProjectId
  );

 if(!records.length){

  alert("لا توجد سجلات.");

  return;
 }

 if(typeof JSZip==="undefined"){

  alert(
   "مكتبة Excel لم يتم تحميلها. افتح الصفحة بالإنترنت ثم حاول مرة أخرى."
  );

  return;
 }

 const zip =
  new JSZip();

 /* Content Types */

 zip.file(
  "[Content_Types].xml",
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
  <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">

   <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
   <Default Extension="xml" ContentType="application/xml"/>
   <Default Extension="jpeg" ContentType="image/jpeg"/>

   <Override PartName="/xl/workbook.xml"
    ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>

   <Override PartName="/xl/worksheets/sheet1.xml"
    ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>

   <Override PartName="/xl/drawings/drawing1.xml"
    ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>

   <Override PartName="/xl/styles.xml"
    ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>

  </Types>`
 );

 zip.file(
  "_rels/.rels",
  `<?xml version="1.0" encoding="UTF-8"?>
  <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">

   <Relationship
    Id="rId1"
    Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument"
    Target="xl/workbook.xml"/>

  </Relationships>`
 );

 zip.file(
  "xl/workbook.xml",
  `<?xml version="1.0" encoding="UTF-8"?>
  <workbook
   xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
   xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">

   <sheets>
    <sheet
     name="Inspections"
     sheetId="1"
     r:id="rId1"/>
   </sheets>

  </workbook>`
 );

 zip.file(
  "xl/_rels/workbook.xml.rels",
  `<?xml version="1.0" encoding="UTF-8"?>
  <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">

   <Relationship
    Id="rId1"
    Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet"
    Target="worksheets/sheet1.xml"/>

   <Relationship
    Id="rId2"
    Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles"
    Target="styles.xml"/>

  </Relationships>`
 );

 zip.file(
  "xl/styles.xml",
  `<?xml version="1.0" encoding="UTF-8"?>
  <styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">

   <fonts count="2">

    <font>
     <sz val="11"/>
     <name val="Arial"/>
    </font>

    <font>
     <b/>
     <sz val="11"/>
     <name val="Arial"/>
    </font>

   </fonts>

   <fills count="2">
    <fill>
     <patternFill patternType="none"/>
    </fill>
    <fill>
     <patternFill patternType="gray125"/>
    </fill>
   </fills>

   <borders count="1">
    <border>
     <left/>
     <right/>
     <top/>
     <bottom/>
     <diagonal/>
    </border>
   </borders>

   <cellStyleXfs count="1">
    <xf numFmtId="0" fontId="0" fillId="0" borderId="0"/>
   </cellStyleXfs>

   <cellXfs count="2">
    <xf numFmtId="0" fontId="0" fillId="0" borderId="0"/>
    <xf numFmtId="0" fontId="1" fillId="0" borderId="0" applyFont="1"/>
   </cellXfs>

  </styleSheet>`
 );

 /* Rows */

 const headers=[
  "Project",
  "Project Code",
  "Unit",
  "Engineer",
  "Date",
  "Type",
  "Inspection Note",
  "Photo"
 ];

 function cell(ref,value,style=0){

  const safe =
   escapeXml(
    value
   );

  return `
   <c r="${ref}" s="${style}" t="inlineStr">
    <is>
     <t>${safe}</t>
    </is>
   </c>
  `;

 }

 let sheetRows="";

 sheetRows+=`<row r="1">`;

 headers.forEach(
  (h,i)=>{

   sheetRows+=
    cell(
     columnName(i+1)+"1",
     h,
     1
    );

  }
 );

 sheetRows+=`</row>`;

 const imageRelations=[];

 records.forEach(
  (r,index)=>{

   const row =
    index+2;

   sheetRows+=`<row r="${row}">`;

   sheetRows+=
    cell(
     "A"+row,
     r.project
    );

   sheetRows+=
    cell(
     "B"+row,
     r.projectCode
    );

   sheetRows+=
    cell(
     "C"+row,
     r.unit
    );

   sheetRows+=
    cell(
     "D"+row,
     r.engineer
    );

   sheetRows+=
    cell(
     "E"+row,
     new Date(r.date)
      .toLocaleString("en-GB")
    );

   sheetRows+=
    cell(
     "F"+row,
     r.kind==="photo"
      ?"Photo Inspection"
      :"Note Only"
    );

   sheetRows+=
    cell(
     "G"+row,
     r.note
    );

   sheetRows+=
    cell(
     "H"+row,
     r.photo
      ?"See embedded image"
      :""
    );

   sheetRows+=`</row>`;

   if(r.photo){

    const imageId =
     imageRelations.length+1;

    imageRelations.push({
     id:imageId,
     row:row,
     data:r.photo
    });

   }

 );

 let drawingXml="";

 drawingXml+=`
 <xdr:wsDr
  xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing"
  xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">
 `;

 imageRelations.forEach(
  img=>{

   drawingXml+=`

   <xdr:twoCellAnchor>

    <xdr:from>
     <xdr:col>7</xdr:col>

     <xdr:row>${img.row-1}</xdr:row>
     <xdr:rowOff>0</xdr:rowOff>

    <xdr:to>
     <xdr:col>11</xdr:col>
     <xdr:colOff>0</xdr:colOff>
     <xdr:row>${img.row+10}</xdr:row>
     <xdr:rowOff>0</xdr:rowOff>
    </xdr:to>

    <xdr:pic>

     <xdr:nvPicPr>

      <xdr:cNvPr
       id="${img.id}"
       name="Inspection Image ${img.id}"/>

      <xdr:cNvPicPr/>

     </xdr:nvPicPr>

     <xdr:blipFill>

      <a:blip
       r:embed="rId${img.id}"
       xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/>

      <a:stretch>
       <a:fillRect/>
      </a:stretch>

     </xdr:blipFill>

     <xdr:spPr>
      <a:prstGeom prst="rect">
       <a:avLst/>
      </a:prstGeom>
     </xdr:spPr>

    </xdr:pic>

    <xdr:clientData/>

   </xdr:twoCellAnchor>
   `;

  }
 );

 drawingXml+=`</xdr:wsDr>`;

 zip.file(
  "xl/drawings/drawing1.xml",
  `<?xml version="1.0" encoding="UTF-8"?>`
  +drawingXml
 );

 let drawingRels="";

 imageRelations.forEach(
  img=>{

   drawingRels+=`

   <Relationship
    Id="rId${img.id}"
    Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image"
    Target="../media/image${img.id}.jpeg"/>
   `;

   const base64 =
    img.data.split(",")[1];

   zip.file(
    `xl/media/image${img.id}.jpeg`,
    base64,
    {base64:true}
   );

  }
 );

 zip.file(
  "xl/drawings/_rels/drawing1.xml.rels",
  `<?xml version="1.0" encoding="UTF-8"?>
  <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  ${drawingRels}
  </Relationships>`
 );

 zip.file(
  "xl/worksheets/_rels/sheet1.xml.rels",
  `<?xml version="1.0" encoding="UTF-8"?>
  <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">

   <Relationship
    Id="rId1"
    Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing"
    Target="../drawings/drawing1.xml"/>

  </Relationships>`
 );

 zip.file(
  "xl/worksheets/sheet1.xml",
  `<?xml version="1.0" encoding="UTF-8"?>
  <worksheet
   xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
   xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">

   <sheetData>
    ${sheetRows}
   </sheetData>

   <drawing r:id="rId1"/>

  </worksheet>`
 );

 const blob =
  await zip.generateAsync({
   type:"blob",
   mimeType:
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  });

 const project =
  (await getProjects())
  .find(
   p=>p.id===currentProjectId
  );

 const filename =
  (
   project?.name ||
   "SiteInspection"
  )
  .replace(
   /[\\/:*?"<>|]/g,
   "_"
  );

 downloadBlob(
  blob,
  filename+"_Inspections.xlsx"
 );

}

/* =========================
   HELPERS
========================= */

function columnName(n){

 let s="";

 while(n>0){

  const rem =
   (n-1)%26;

  s=
   String.fromCharCode(
    65+rem
   )+s;

  n=
   Math.floor(
    (n-1)/26
   );

 }

 return s;

}

function escapeXml(value){

 return String(
  value ?? ""
 )
 .replace(
  /[<>&'"]/g,
  c=>({

   "<":"&lt;",
   ">":"&gt;",
   "&":"&amp;",
   "'":"&apos;",
   '"':"&quot;"

  }[c])
 );

}

function downloadBlob(
 blob,
 filename
){

 const url =
  URL.createObjectURL(blob);

 const a =
  document.createElement("a");

 a.href=url;

 a.download=filename;

 document.body.appendChild(a);

 a.click();

 a.remove();

 setTimeout(
  ()=>URL.revokeObjectURL(url),
  2000
 );

}

function scrollToInspection(){

 window.scrollTo({
  top:document.body.scrollHeight,
  behavior:"smooth"
 });

}
